<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Glorious Generation 2226</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: #3b0710;
        }


        /* =====================================
           GAMBAR GROUP SEBAGAI BACKGROUND
        ===================================== */

        .background {
            position: fixed;
            inset: 0;

            background-image: url("group.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            /* Sedikit blur supaya gambar tidak terlalu semak */
            filter: blur(1px);

            transform: scale(1.03);

            z-index: -3;
        }


        /* =====================================
           OVERLAY MAROON
        ===================================== */

        .overlay {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(35, 2, 5, 0.82),
                    rgba(75, 5, 18, 0.78),
                    rgba(128, 0, 32, 0.75)
                );

            z-index: -2;
        }


        /* =====================================
           OVERLAY TAMBAHAN UNTUK BAHAGIAN TENGAH
        ===================================== */

        .content-background {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 94%;
            height: 88%;

            border-radius: 35px;

            background:
                linear-gradient(
                    135deg,
                    rgba(25, 2, 5, 0.72),
                    rgba(80, 5, 20, 0.58),
                    rgba(110, 0, 30, 0.62)
                );

            backdrop-filter: blur(4px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);

            z-index: -1;
        }


        /* =====================================
           KANDUNGAN UTAMA
        ===================================== */

        .content {

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 40px;

        }


        /* =====================================
           BADGE
        ===================================== */

        .badge {

            background-color: rgba(50, 10, 10, 0.65);

            color: #ffd700;

            border: 2px solid #ffd700;

            padding: 10px 32px;

            border-radius: 50px;

            font-size: 1.3rem;

            font-weight: 600;

            letter-spacing: 1px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-bottom: 1.5rem;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.3);

        }


        /* =====================================
           LOGO
        ===================================== */

        .badge-logo {

            height: 2.5em;

            width: auto;

            object-fit: contain;

        }


        /* =====================================
           TAJUK
        ===================================== */

        h1 {

            font-size: clamp(3rem, 5vw, 5rem);

            font-weight: 900;

            text-shadow:
                2px 4px 15px rgba(0,0,0,0.8);

            letter-spacing: 2px;

        }


        /* =====================================
           TARIKH
        ===================================== */

        p.date-info {

            font-size: clamp(1rem, 2vw, 1.5rem);

            color: #eeeeee;

            margin-top: 0.7rem;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.7);

        }


        /* =====================================
           COUNTDOWN
        ===================================== */

        .countdown-container {

            display: flex;

            gap: 1.5rem;

            margin-top: 2.5rem;

            justify-content: center;

            align-items: center;

        }


        /* =====================================
           TIME BOX
        ===================================== */

        .time-box {

            background:

                linear-gradient(
                    145deg,
                    rgba(70, 10, 20, 0.78),
                    rgba(30, 5, 10, 0.72)
                );

            border:

                2px solid
                rgba(255,255,255,0.20);

            padding: 2rem;

            border-radius: 22px;

            width: 210px;
            height: 185px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            box-shadow:

                0 15px 35px
                rgba(0,0,0,0.45);

            backdrop-filter: blur(12px);

            transition: 0.3s;

        }


        /* Hover effect */

        .time-box:hover {

            transform: translateY(-5px);

            border-color: #ffd700;

            box-shadow:

                0 15px 40px
                rgba(255,215,0,0.15);

        }


        /* =====================================
           NOMBOR
        ===================================== */

        .number {

            font-size: 4.5rem;

            font-weight: 900;

            color: #ffffff;

            line-height: 1;

            text-shadow:

                0 4px 15px rgba(0,0,0,0.6);

        }


        /* =====================================
           LABEL
        ===================================== */

        .label {

            font-size: 1.1rem;

            color: #ffd700;

            text-transform: uppercase;

            margin-top: 0.9rem;

            letter-spacing: 2px;

            font-weight: bold;

        }


        /* =====================================
           FOOTER
        ===================================== */

        .footer {

            margin-top: 2rem;

            max-width: 1200px;

            font-size: 1rem;

            line-height: 1.6;

            color: rgba(255,255,255,0.9);

            text-shadow:

                0 2px 8px rgba(0,0,0,0.8);

        }


        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 1000px) {

            .countdown-container {

                gap: 10px;

            }

            .time-box {

                width: 170px;
                height: 160px;

            }

            .number {

                font-size: 3.5rem;

            }

        }


        @media (max-width: 700px) {

            .content {

                padding: 20px;

            }

            .countdown-container {

                gap: 6px;

            }

            .time-box {

                width: 23vw;
                height: 130px;

                padding: 1rem;

            }

            .number {

                font-size: 2.5rem;

            }

            .label {

                font-size: 0.8rem;

            }

            .footer {

                font-size: 0.75rem;

            }

        }

    </style>
</head>


<body>


    <!-- =====================================
         BACKGROUND GROUP
    ====================================== -->

    <div class="background"></div>


    <!-- =====================================
         OVERLAY GELAP
    ====================================== -->

    <div class="overlay"></div>


    <!-- =====================================
         PANEL TENGAH
    ====================================== -->

    <div class="content-background"></div>


    <!-- =====================================
         CONTENT
    ====================================== -->

    <main class="content">


        <!-- BADGE -->

        <div class="badge">

            <img
                src="logo.png"
                alt="Logo Batch"
                class="badge-logo"
            >

            Glorious Generation 2226

        </div>


        <!-- TAJUK -->

        <h1>
            COUNTDOWN SPM
        </h1>


        <!-- TARIKH -->

        <p class="date-info">

            Isnin, 23 November 2026 |
            8:00 Pagi (MYT)

        </p>


        <!-- COUNTDOWN -->

        <div class="countdown-container">


            <!-- HARI -->

            <div class="time-box">

                <div
                    class="number"
                    id="days">
                    00
                </div>

                <div class="label">
                    Hari
                </div>

            </div>


            <!-- JAM -->

            <div class="time-box">

                <div
                    class="number"
                    id="hours">
                    00
                </div>

                <div class="label">
                    Jam
                </div>

            </div>


            <!-- MINIT -->

            <div class="time-box">

                <div
                    class="number"
                    id="minutes">
                    00
                </div>

                <div class="label">
                    Minit
                </div>

            </div>


            <!-- SAAT -->

            <div class="time-box">

                <div
                    class="number"
                    id="seconds">
                    00
                </div>

                <div class="label">
                    Saat
                </div>

            </div>


        </div>


        <!-- FOOTER -->

        <div class="footer">

            Semoga Allah memberkati setiap usaha kami,
            memudahkan urusan kami, dan mengurniakan
            kejayaan yang terbaik

            <br>

            GP 1.67 & Straight A+ SPM 2026. 🤲🏻

        </div>


    </main>


    <!-- =====================================
         JAVASCRIPT COUNTDOWN
    ====================================== -->

    <script>

        // Tarikh Sasaran:
        // 23 November 2026, 8:00 AM

        const targetDate =
            new Date(
                "November 23, 2026 08:00:00"
            ).getTime();


        function updateCountdown() {

            const now =
                new Date().getTime();


            const difference =
                targetDate - now;


            if (difference > 0) {


                const days =
                    Math.floor(
                        difference /
                        (1000 * 60 * 60 * 24)
                    );


                const hours =
                    Math.floor(
                        (difference %
                        (1000 * 60 * 60 * 24))
                        /
                        (1000 * 60 * 60)
                    );


                const minutes =
                    Math.floor(
                        (difference %
                        (1000 * 60 * 60))
                        /
                        (1000 * 60)
                    );


                const seconds =
                    Math.floor(
                        (difference %
                        (1000 * 60))
                        /
                        1000
                    );


                document.getElementById("days")
                    .innerText =
                    String(days)
                    .padStart(2, '0');


                document.getElementById("hours")
                    .innerText =
                    String(hours)
                    .padStart(2, '0');


                document.getElementById("minutes")
                    .innerText =
                    String(minutes)
                    .padStart(2, '0');


                document.getElementById("seconds")
                    .innerText =
                    String(seconds)
                    .padStart(2, '0');

            }


            else {

                document.querySelector(
                    ".countdown-container"
                ).innerHTML =

                    "<h1 style='color:#ffd700;'>HARI KEJADIAN TELAH TIBA!</h1>";

            }

        }


        // Update setiap saat

        setInterval(
            updateCountdown,
            1000
        );


        // Jalankan terus

        updateCountdown();

    </script>


</body>
</html>
