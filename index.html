
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glorious Generation 2226 | SPM 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #35030d;
    color: white;
}

.background {
    position: fixed;
    inset: -2%;
    background: url("group.jpg") center center / cover no-repeat;
    filter: blur(4px);
    z-index: -5;
}

.overlay {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 8% 12%,
            rgba(255,150,48,.30), transparent 28%),
        radial-gradient(circle at 92% 88%,
            rgba(255,100,28,.28), transparent 30%),
        radial-gradient(circle at 50% 45%,
            rgba(150,0,43,.25), transparent 55%),
        linear-gradient(135deg,
            rgba(35,3,8,.84),
            rgba(85,4,22,.78),
            rgba(145,0,42,.70),
            rgba(65,3,15,.84));
    z-index: -4;
}

.vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center,
        transparent 35%, rgba(20,0,5,.50) 100%);
    pointer-events: none;
    z-index: -3;
}

.top-logo {
    position: fixed;
    top: 15px;
    right: 20px;
    width: clamp(70px, 12vw, 180px);
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,.5));
    z-index: 10;
}

.gold-line {
    position: fixed;
    width: 260px;
    height: 3px;
    background: linear-gradient(90deg,
        transparent, #ffd700, #fff1a8, #ffd700, transparent);
    opacity: .75;
    filter: drop-shadow(0 0 8px rgba(255,215,0,.65));
}

.gold-line.top {
    top: 45px;
    left: -50px;
    transform: rotate(-35deg);
}

.gold-line.bottom {
    bottom: 45px;
    right: -50px;
    transform: rotate(-35deg);
}

.content {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 35px;
}

.badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 10px 30px;
    min-height: 65px;
    border-radius: 50px;
    background: linear-gradient(135deg,
        rgba(30,5,8,.88), rgba(90,10,20,.75));
    border: 2px solid rgba(255,215,0,.9);
    color: #ffd700;
    font-size: clamp(1rem, 1.5vw, 1.4rem);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 35px;
    box-shadow: 0 0 20px rgba(255,180,50,.18);
    backdrop-filter: blur(12px);
}

.badge-logo {
    height: 2.2em;
    width: auto;
    max-width: 65px;
    object-fit: contain;
}

h1 {
    max-width: 95%;
    font-size: clamp(2.5rem, 6.5vw, 6rem);
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.12;
    color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.2),
                 0 8px 25px rgba(0,0,0,.7);
}

.title-line {
    width: min(700px, 65vw);
    height: 3px;
    margin-top: 28px;
    margin-bottom: 25px;
    background: linear-gradient(90deg,
        transparent, #ffd700, #fff3b0, #ffd700, transparent);
    box-shadow: 0 0 10px rgba(255,215,0,.55);
}

.date-info {
    font-size: clamp(1rem, 2vw, 1.65rem);
    color: rgba(255,255,255,.95);
    line-height: 1.6;
    text-shadow: 0 3px 10px rgba(0,0,0,.75);
}

.goodluck {
    margin-top: 42px;
    font-size: clamp(1.5rem, 3.5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffd700;
    text-shadow: 0 3px 12px rgba(0,0,0,.85);
}

.batch-slogan {
    margin-top: 16px;
    font-size: clamp(1rem, 1.8vw, 1.7rem);
    font-weight: 800;
    letter-spacing: 3px;
    color: white;
    text-shadow: 0 3px 12px rgba(0,0,0,.85);
}

@media (max-width: 800px) {
    .content {
        padding: 20px;
    }

    .top-logo {
        top: 8px;
        right: 8px;
        width: 75px;
    }

    .badge {
        padding: 8px 18px;
        min-height: 50px;
        margin-bottom: 28px;
    }

    h1 {
        letter-spacing: 1px;
    }

    .title-line {
        margin-top: 22px;
        margin-bottom: 18px;
    }

    .goodluck {
        margin-top: 30px;
        letter-spacing: 3px;
    }

    .batch-slogan {
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>
<div class="vignette"></div>

<img src="logo.png" class="top-logo" alt="Logo">

<div class="gold-line top"></div>
<div class="gold-line bottom"></div>

<main class="content">

    <div class="badge">
        <img src="logo.png" class="badge-logo" alt="Logo Glorious">
        <span>GLORIOUS GENERATION 2226</span>
    </div>

    <h1 id="exam-title">SPM 2026</h1>

    <div class="title-line"></div>

    <p class="date-info" id="exam-date">
        Memuatkan tarikh peperiksaan...
    </p>

    <div class="goodluck">GOOD LUCK!</div>

    <div class="batch-slogan">
        ONCE GLORIOUS, ALWAYS GLORIOUS
    </div>

</main>

<script>
// ==========================================
// JADUAL PEPERIKSAAN SPM 2026
// Bulan menggunakan format JavaScript: 0 = Januari
// ==========================================

const exams = [
    {
        start: "2026-10-26",
        end: "2026-10-29",
        title: "UBBM SPM"
    },
    {
        start: "2026-11-02",
        end: "2026-11-05",
        title: "BAHASA INGGERIS SPM"
    },
    {
        start: "2026-11-16",
        end: "2026-11-16",
        title: "FIZIK SPM"
    },
    {
        start: "2026-11-17",
        end: "2026-11-17",
        title: "KIMIA SPM"
    },
    {
        start: "2026-11-18",
        end: "2026-11-18",
        title: "BIOLOGI SPM"
    },
    {
        start: "2026-11-23",
        end: "2026-11-23",
        title: "BAHASA MELAYU SPM"
    },
    {
        start: "2026-11-24",
        end: "2026-11-24",
        title: "BAHASA INGGERIS SPM"
    },
    {
        start: "2026-11-25",
        end: "2026-11-25",
        title: "PENDIDIKAN ISLAM SPM"
    },
    {
        start: "2026-11-26",
        end: "2026-11-26",
        title: "MATEMATIK SPM"
    },
    {
        start: "2026-11-30",
        end: "2026-11-30",
        title: "SEJARAH SPM"
    },
    {
        start: "2026-12-01",
        end: "2026-12-01",
        title: "PENDIDIKAN SENI VISUAL SPM"
    },
    {
        start: "2026-12-02",
        end: "2026-12-02",
        title: "BIOLOGI SPM"
    },
    {
        start: "2026-12-03",
        end: "2026-12-03",
        title: "FIZIK SPM"
    },
    {
        start: "2026-12-15",
        end: "2026-12-15",
        title: "KIMIA SPM"
    },
    {
        start: "2026-12-17",
        end: "2026-12-17",
        title: "MATEMATIK TAMBAHAN SPM"
    }
];

// ==========================================
// FORMAT TARIKH MENGIKUT WAKTU MALAYSIA
// ==========================================

const weekdays = [
    "Ahad", "Isnin", "Selasa", "Rabu",
    "Khamis", "Jumaat", "Sabtu"
];

const months = [
    "Januari", "Februari", "Mac", "April",
    "Mei", "Jun", "Julai", "Ogos",
    "September", "Oktober", "November", "Disember"
];

function formatDate(dateString) {
    const [year, month, day] = dateString.split("-").map(Number);

    // Guna tengah hari UTC untuk elakkan isu pertukaran hari.
    const date = new Date(Date.UTC(year, month - 1, day, 12));

    const weekday = weekdays[date.getUTCDay()];
    const monthName = months[month - 1];

    return `${weekday}, ${day} ${monthName} ${year} | 8:00 Pagi (MYT)`;
}

// ==========================================
// DAPATKAN TARIKH HARI INI DI MALAYSIA
// ==========================================

function getTodayMYT() {
    const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Kuala_Lumpur",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());

    const values = {};
    parts.forEach(part => {
        if (part.type !== "literal") {
            values[part.type] = part.value;
        }
    });

    return `${values.year}-${values.month}-${values.day}`;
}

// ==========================================
// KEMAS KINI PAPARAN
// ==========================================

function updateExam() {
    const today = getTodayMYT();

    // Jika hari ini dalam tempoh peperiksaan,
    // paparkan tajuk peperiksaan hari tersebut.
    let exam = exams.find(item =>
        today >= item.start && today <= item.end
    );

    // Jika tiada peperiksaan hari ini,
    // cari peperiksaan yang akan datang.
    if (!exam) {
        exam = exams.find(item => item.start > today);
    }

    const titleElement = document.getElementById("exam-title");
    const dateElement = document.getElementById("exam-date");

    if (exam) {
        titleElement.textContent = exam.title;
        dateElement.textContent = formatDate(exam.start);
    } else {
        titleElement.textContent = "TAHNIAH, GLORIOUS!";
        dateElement.textContent = "SPM 2026 telah selesai";
    }
}

// Kemas kini apabila laman dibuka.
updateExam();

// Semak setiap saat supaya perubahan hari
// mengikut waktu Malaysia dikesan secara automatik.
setInterval(updateExam, 1000);
</script>

</body>
</html>
