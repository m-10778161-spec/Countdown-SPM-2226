<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Glorious Generation 2226</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { width: 100vw; height: 100vh; overflow: hidden; color: white; position: relative; background: #35030d; }

        .background {
            position: fixed; inset: 0;
            background-image: url("group.jpg");
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            filter: blur(4px); transform: scale(1.06); z-index: -5;
        }

        .overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 8% 12%, rgba(255,150,48,0.30), transparent 28%),
                radial-gradient(circle at 92% 88%, rgba(255,100,28,0.28), transparent 30%),
                radial-gradient(circle at 50% 45%, rgba(150,0,43,0.25), transparent 55%),
                linear-gradient(135deg, rgba(35,3,8,0.84), rgba(85,4,22,0.78), rgba(145,0,42,0.70), rgba(65,3,15,0.84));
            z-index: -4;
        }

        .top-logo {
            position: fixed; top: 5px; right: 5px; width: 180px; height: auto; z-index: 10;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(20,0,5,0.50) 100%);
            pointer-events: none; z-index: -3;
        }

        .gold-line {
            position: fixed; width: 260px; height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, #fff1a8, #ffd700, transparent);
            opacity: 0.75; filter: drop-shadow(0 0 8px rgba(255,215,0,0.65));
        }
        .gold-line.top { top: 45px; left: -50px; transform: rotate(-35deg); }
        .gold-line.bottom { bottom: 45px; right: -50px; transform: rotate(-35deg); }

        .content {
            width: 100%; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 35px 35px 50px;
        }

        .badge {
            display: inline-flex; align-items: center; justify-content: center; gap: 15px;
            padding: 10px 35px; min-height: 68px; border-radius: 50px;
            background: linear-gradient(135deg, rgba(30,5,8,0.88), rgba(90,10,20,0.75));
            border: 2px solid rgba(255,215,0,0.90); color: #ffd700;
            font-size: clamp(1rem, 1.5vw, 1.4rem); font-weight: 700; letter-spacing: 1px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255,180,50,0.18), inset 0 0 15px rgba(255,215,0,0.06);
            backdrop-filter: blur(12px);
        }

        .badge-logo { height: 2.5em; width: auto; max-width: 70px; object-fit: contain; }

        h1 {
            font-size: clamp(2.2rem, 5.5vw, 5.5rem); font-weight: 900; letter-spacing: 3px;
            line-height: 1.05; color: #ffffff; text-transform: none;
            text-shadow: 0 4px 0 rgba(0,0,0,0.20), 0 8px 25px rgba(0,0,0,0.70);
        }

        .title-line {
            width: min(700px, 60vw); height: 2px; margin-top: 14px; margin-bottom: 12px;
            background: linear-gradient(90deg, transparent, #ffd700, #fff3b0, #ffd700, transparent);
            box-shadow: 0 0 10px rgba(255,215,0,0.55);
        }

        p.date-info {
            font-size: clamp(1rem, 1.8vw, 1.5rem); color: rgba(255,255,255,0.92); margin-top: 0;
            text-shadow: 0 3px 10px rgba(0,0,0,0.75);
        }

        .countdown-container {
            display: flex; justify-content: center; align-items: center;
            gap: clamp(12px, 1.8vw, 28px); margin-top: 38px;
        }

        .time-box {
            width: clamp(150px, 12vw, 220px); height: clamp(150px, 16vw, 200px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(105,8,28,0.72), rgba(35,3,13,0.82));
            border: 2px solid rgba(255,215,140,0.50); backdrop-filter: blur(14px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.50), inset 0 0 20px rgba(255,80,80,0.04);
            transition: all 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-6px); border-color: #ffd700;
            box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 0 20px rgba(255,215,0,0.15);
        }

        .number {
            font-size: clamp(3rem, 5vw, 5rem); font-weight: 900; line-height: 1; color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.70);
        }

        .label {
            margin-top: 15px; font-size: clamp(0.85rem, 1.2vw, 1.2rem); font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase; color: #ffd700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.70);
        }

        .goodluck {
            display: none; margin-top: 38px; color: #ffd700;
            font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 900; letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.80);
        }

        .footer {
            max-width: 1200px; margin-top: 35px; font-size: clamp(0.75rem, 1.2vw, 1.05rem);
            line-height: 1.7; color: rgba(255,255,255,0.90); text-shadow: 0 2px 8px rgba(0,0,0,0.85);
        }

        .batch-slogan {
            display: inline-block; margin-top: 8px; font-size: clamp(1.3rem, 2.2vw, 2.2rem);
            font-weight: 900; letter-spacing: 3px; color: #ffd700; text-shadow: 0 3px 12px rgba(0,0,0,0.85);
        }

        @media (max-width: 800px) {
            .content { padding: 20px; }
            .top-logo { width: 90px; top: -30px; right: -30px; }
            .badge { padding: 8px 20px; min-height: 55px; }
            .countdown-container { gap: 6px; margin-top: 25px; }
            .time-box { width: 23vw; height: 130px; border-radius: 15px; }
            .number { font-size: 2.5rem; }
            .label { font-size: 0.7rem; letter-spacing: 1px; }
            .footer { margin-top: 22px; }
            .batch-slogan { font-size: 1.1rem; letter-spacing: 2px; margin-top: 6px; }
        }

        :fullscreen .content { height: 100vh; }

        .clock {
            position: fixed; bottom: 3px; left: 0; right: 0; text-align: center;
            font-size: 0.65rem; letter-spacing: 1px; color: rgba(255,255,255,0.40);
            text-shadow: 0 2px 6px rgba(0,0,0,0.85); pointer-events: none; z-index: 10;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body>

    <img src="logo.png" class="top-logo" alt="Logo">

    <div class="background"></div>
    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="gold-line top"></div>
    <div class="gold-line bottom"></div>

    <main class="content">

        <div class="badge">
            <img src="logo.png" alt="Logo Batch" class="badge-logo">
            <span>Glorious Generation 2226</span>
        </div>

        <h1 id="title">UBBI SPM</h1>

        <div class="title-line"></div>

        <p class="date-info" id="dateInfo"></p>

        <div class="countdown-container" id="countdown">
            <div class="time-box"><div class="number" id="days">00</div><div class="label">Hari</div></div>
            <div class="time-box"><div class="number" id="hours">00</div><div class="label">Jam</div></div>
            <div class="time-box"><div class="number" id="minutes">00</div><div class="label">Minit</div></div>
            <div class="time-box"><div class="number" id="seconds">00</div><div class="label">Saat</div></div>
        </div>

        <div class="goodluck" id="goodluck">GOOD LUCK GLORIOUS!!!</div>

        <div class="footer">
            Semoga Allah memberkati setiap usaha anda, memudahkan urusan anda, dan mengurniakan keputusan yang cemerlang
            <br>
            GP 1.67 &amp; Straight A+ SPM 2026. 🤲🏻
            <br>
            <span class="batch-slogan">TOGETHER WE DOMINATE</span>
        </div>

    </main>

    <div class="clock" id="clock"></div>

    <script>

        /* =====================================
           JADUAL SPM 2026
           date  = tarikh (YYYY-MM-DD, waktu Malaysia)
           time  = masa kertas pertama hari itu (HH:MM, 24 jam)
           title = tajuk besar
           day / dateText / timeText = teks paparan bawah tajuk
           Kalau 1 kertas sahaja -> tajuk khusus (cth: Amali Kimia SPM)
           Kalau 2+ kertas sehari -> nama subjek sahaja (cth: BAHASA MELAYU SPM)
        ===================================== */

        const schedule = [
            { date: "2026-11-02", time: "07:50", title: "UBBI SPM",                  day: "Isnin",  dateText: "2 November 2026",  timeText: "7:50 Pagi" },
            { date: "2026-11-03", time: "07:50", title: "UBBI SPM DAY 2",                  day: "Selasa", dateText: "3 November 2026",  timeText: "7:50 Pagi" },
            { date: "2026-11-04", time: "07:50", title: "UBBI SPM DAY 3",                  day: "Rabu",   dateText: "4 November 2026",  timeText: "7:50 Pagi" },
            { date: "2026-11-05", time: "07:50", title: "UBBI SPM DAY 4",                  day: "Khamis", dateText: "5 November 2026",  timeText: "7:50 Pagi" },

            { date: "2026-11-16", time: "08:00", title: "AMALI FIZIK SPM",           day: "Isnin",  dateText: "16 November 2026", timeText: "8:00 Pagi" },
            { date: "2026-11-17", time: "08:00", title: "AMALI KIMIA SPM",           day: "Selasa", dateText: "17 November 2026", timeText: "8:00 Pagi" },
            { date: "2026-11-18", time: "08:00", title: "AMALI BIOLOGI SPM",         day: "Rabu",   dateText: "18 November 2026", timeText: "8:00 Pagi" },

            { date: "2026-11-23", time: "09:00", title: "BAHASA MELAYU SPM",         day: "Isnin",  dateText: "23 November 2026", timeText: "9:00 Pagi" },
            { date: "2026-11-24", time: "09:00", title: "BAHASA INGGERIS SPM",       day: "Selasa", dateText: "24 November 2026", timeText: "9:00 Pagi" },
            { date: "2026-11-25", time: "08:15", title: "PENDIDIKAN ISLAM SPM",      day: "Rabu",   dateText: "25 November 2026", timeText: "8:15 Pagi" },
            { date: "2026-11-26", time: "08:15", title: "MATEMATIK SPM",             day: "Khamis", dateText: "26 November 2026", timeText: "8:15 Pagi" },
            { date: "2026-11-30", time: "08:15", title: "SEJARAH SPM",               day: "Isnin",  dateText: "30 November 2026", timeText: "8:15 Pagi" },
            { date: "2026-12-01", time: "08:15", title: "PENDIDIKAN SENI VISUAL SPM",day: "Selasa", dateText: "1 Disember 2026",  timeText: "8:15 Pagi" },
            { date: "2026-12-02", time: "08:15", title: "BIOLOGI SPM",               day: "Rabu",   dateText: "2 Disember 2026",  timeText: "8:15 Pagi" },
            { date: "2026-12-03", time: "08:15", title: "FIZIK SPM",                 day: "Khamis", dateText: "3 Disember 2026",  timeText: "8:15 Pagi" },
            { date: "2026-12-15", time: "08:15", title: "KIMIA SPM",                 day: "Selasa", dateText: "15 Disember 2026", timeText: "8:15 Pagi" },
            { date: "2026-12-17", time: "08:15", title: "MATEMATIK TAMBAHAN SPM",    day: "Khamis", dateText: "17 Disember 2026", timeText: "8:15 Pagi" }
        ];


        /* Masa TAMAT kertas terakhir setiap hari (HH:MM, waktu Malaysia).
           Lepas masa ni, paparan auto tukar ke countdown kertas seterusnya. */
        const endTimes = {
            "2026-11-02": "16:45",
            "2026-11-03": "16:45",
            "2026-11-04": "16:45",
            "2026-11-05": "16:45",
            "2026-11-16": "11:45",
            "2026-11-17": "11:45",
            "2026-11-18": "11:45",
            "2026-11-23": "17:00",
            "2026-11-24": "16:00",
            "2026-11-25": "10:45",
            "2026-11-26": "13:15",
            "2026-11-30": "13:00",
            "2026-12-01": "13:00",
            "2026-12-02": "13:15",
            "2026-12-03": "13:00",
            "2026-12-15": "13:15",
            "2026-12-17": "17:00"
        };

        /* Cari kertas seterusnya: yang masa tamatnya belum lepas */
        function currentEvent() {
            const now = Date.now();
            return schedule.find(e =>
                new Date(e.date + "T" + endTimes[e.date] + ":00+08:00").getTime() > now
            ) || null;
        }

        /* Jam kecil di bawah (waktu Malaysia) */
        function updateClock() {
            const t = new Date().toLocaleTimeString("en-GB", {
                timeZone: "Asia/Kuala_Lumpur", hour12: false
            });
            document.getElementById("clock").innerText = " " + t + " ";
        }

        let shownDate = null;

        function render(event) {
            document.getElementById("title").innerText = event.title;
            document.getElementById("dateInfo").innerText =
                event.day + ", " + event.dateText + " | " + event.timeText + " (MYT)";
            shownDate = event.date;
        }

        function pad(n) { return String(n).padStart(2, "0"); }

        function updateCountdown() {

            updateClock();

            const event = currentEvent();
            const box = document.getElementById("countdown");
            const goodluck = document.getElementById("goodluck");

            /* Semua kertas dah habis */
            if (!event) {
                document.getElementById("title").innerText = "SPM 2026";
                document.getElementById("dateInfo").innerText = "Semua kertas telah selesai";
                box.style.display = "none";
                goodluck.style.display = "block";
                goodluck.innerText = "GLORIOUS GENERATION SIGNED OUT";
                return;
            }

            if (shownDate !== event.date) render(event);

            const target = new Date(event.date + "T" + event.time + ":00+08:00").getTime();
            const diff = target - Date.now();

            if (diff > 0) {
                box.style.display = "flex";
                goodluck.style.display = "none";

                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);

                document.getElementById("days").innerText = pad(d);
                document.getElementById("hours").innerText = pad(h);
                document.getElementById("minutes").innerText = pad(m);
                document.getElementById("seconds").innerText = pad(s);
            }
            else {
                /* Kertas sedang berlangsung — kekal sampai masa tamat, lepas tu auto tukar subjek seterusnya */
                box.style.display = "none";
                goodluck.style.display = "block";
                goodluck.innerText = "GOOD LUCK GLORIOUS!!!";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

    </script>

</body>

</html>
